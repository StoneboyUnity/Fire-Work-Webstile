<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Привязка Twitch | Fire Work Studio</title>
    <style>
        body {
            background: radial-gradient(circle at 30% 10%, #121212, #050507);
            font-family: 'Segoe UI', system-ui;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: rgba(24,24,32,0.95);
            border-radius: 32px;
            padding: 40px;
            text-align: center;
            border: 1px solid #333;
            max-width: 400px;
        }
        .btn-twitch {
            background: #9146FF;
            color: white;
            padding: 14px 28px;
            border-radius: 48px;
            text-decoration: none;
            display: inline-block;
            font-weight: bold;
            margin-top: 20px;
        }
        .btn-twitch:hover { background: #772ce8; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔥 SHIFT 325</h1>
        <p style="margin: 20px 0;">Для скачивания игры необходимо быть подписанным на Twitch-канал</p>
        <p style="font-size: 1.2rem; color: #9146FF;">fireworkstudio</p>
        <a href="/twitch/login" class="btn-twitch">🔌 Привязать Twitch и проверить подписку</a>
        <p style="margin-top: 20px; font-size: 0.8rem;">После привязки мы автоматически проверим вашу подписку</p>
    </div>
</body>
</html>
