<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | Fire Work Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 30% 10%, #121212, #050507);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            background: rgba(24, 24, 32, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            border: 1px solid #333340;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            background: linear-gradient(135deg, #f2f2f2, #b4b4d0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #9a9ac2;
            margin-bottom: 30px;
            font-size: 0.85rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #cacae2;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: #13131c;
            border: 1px solid #3f3f50;
            border-radius: 16px;
            color: white;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: #7a7aaa;
            background: #1c1c28;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(145deg, #35353f, #24242c);
            border: none;
            border-radius: 48px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background: linear-gradient(145deg, #494957, #30303a);
            transform: translateY(-2px);
        }

        .flash {
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            text-align: center;
        }

        .danger { background: #8b2c2c; }

        .register-link {
            text-align: center;
            margin-top: 25px;
            color: #9a9ac2;
        }

        .register-link a {
            color: #aaaadd;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>🔥 Добро пожаловать</h1>
        <div class="subtitle">Войдите в свою библиотеку игр</div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label>📧 Email</label>
                <input type="email" name="email" required placeholder="your@email.com">
            </div>

            <div class="form-group">
                <label>🔒 Пароль</label>
                <input type="password" name="password" required placeholder="Ваш пароль">
            </div>

            <button type="submit" class="btn">🎮 Войти</button>
        </form>

        <div class="register-link">
            Нет аккаунта? <a href="/register">Зарегистрироваться</a>
        </div>
    </div>
</body>
</html>
